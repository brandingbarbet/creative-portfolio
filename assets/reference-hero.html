<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio Hero Section</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Cursive Handwritten Annotations & Bold Title -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom font family overrides */
        .font-cursive {
            font-family: 'Caveat', cursive;
        }
        .font-title {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: -0.02em;
        }

        /* Deep Navy Blue Background matching reference image */
        body {
            background-color: #1a345c;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Subtle floating animations for stickers */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-10px) rotate(var(--rot, 0deg)); }
        }
        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(10px) rotate(var(--rot, 0deg)); }
        }
        @keyframes pulse-star {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        .animate-float {
            animation: float-slow 5s ease-in-out infinite;
        }
        .animate-float-alt {
            animation: float-reverse 6s ease-in-out infinite;
        }
        .animate-star {
            animation: pulse-star 3s ease-in-out infinite;
        }

        /* Arched arched text style illusion */
        .curved-title-container {
            perspective: 800px;
        }
        .curved-title {
            display: inline-block;
            transform: scaleY(1.05) rotate(-2deg);
            text-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Custom drop shadow filter for floating sticker elements */
        .sticker-shadow {
            filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sticker-shadow:hover {
            transform: scale(1.08) rotate(var(--rot-hover, 0deg)) !important;
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-between selection:bg-white selection:text-blue-900">

    <!-- Top Bar Navigation -->
    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-50 relative">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-white inline-block"></span>
            <span class="font-bold text-xl tracking-tight">CREATIVE STUDIO</span>
        </div>
        <nav class="hidden md:flex space-x-8 text-sm font-semibold tracking-wide text-gray-200">
            <a href="#about" class="hover:text-white transition">ABOUT</a>
            <a href="#services" class="hover:text-white transition">SERVICES</a>
            <a href="#work" class="hover:text-white transition">WORK</a>
            <a href="#contact" class="hover:text-white transition">CONTACT</a>
        </nav>
        <button class="bg-white text-[#1a345c] px-5 py-2.5 rounded-full font-bold text-sm shadow-lg hover:bg-opacity-90 transition transform hover:-translate-y-0.5">
            Get in Touch
        </button>
    </header>

    <!-- Hero Main Section -->
    <main class="relative w-full max-w-7xl mx-auto min-h-[820px] flex flex-col justify-center items-center px-4 overflow-hidden my-auto">

        <!-- Curved Main Portfolio Title -->
        <div class="absolute top-10 sm:top-12 md:top-14 left-1/2 -translate-x-1/2 z-10 w-full text-center curved-title-container pointer-events-none">
            <h1 class="font-title text-[72px] sm:text-[110px] md:text-[150px] lg:text-[180px] text-white leading-none tracking-tight curved-title flex items-center justify-center gap-2 md:gap-4">
                <span>Portf</span>
                <!-- Butterfly embedded inside the letter O -->
                <span class="relative inline-block">
                    o
                    <svg class="absolute -top-3 sm:-top-6 right-0 w-8 h-8 sm:w-16 sm:h-16 text-white opacity-95 animate-pulse" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12,2C12,2 10.5,6.5 8,8C5.5,9.5 2,8.5 2,12C2,15.5 5,16 7,16.5C9,17 11,20 12,22C13,20 15,17 17,16.5C19,16 22,15.5 22,12C22,8.5 18.5,9.5 16,8C13.5,6.5 12,2 12,2Z"/>
                    </svg>
                </span>
                <span>lio</span>
            </h1>
        </div>

        <!-- Central Subject Cutout -->
        <div class="relative z-20 mt-20 sm:mt-24 md:mt-28 w-full max-w-md sm:max-w-lg md:max-w-xl flex justify-center">
            <div class="relative">
                <!-- Main Image cutout with sunglasses, suit, laptop, tote -->
                <img 
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" 
                    alt="Creative Portfolio Owner" 
                    class="w-[280px] sm:w-[360px] md:w-[420px] h-[380px] sm:h-[480px] md:h-[540px] object-cover object-top rounded-t-[140px] shadow-2xl border-4 border-white/20 filter contrast-105 brightness-95"
                    style="mask-image: linear-gradient(to bottom, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);"
                />
            </div>
        </div>

        <!-- Handwritten Annotations & Curved Arrows -->
        <div class="absolute inset-0 z-30 pointer-events-none max-w-6xl mx-auto">

            <!-- 1. Top Left Annotation: Social Media -->
            <div class="absolute top-[38%] left-[16%] sm:left-[22%] md:left-[26%] flex flex-col items-center rotate-[-8deg]">
                <span class="font-cursive text-2xl sm:text-3xl md:text-4xl text-white font-bold tracking-wide">social media</span>
                <svg class="w-16 h-12 sm:w-20 sm:h-16 text-white stroke-current fill-none mt-1 transform rotate-12" viewBox="0 0 100 60">
                    <path d="M 10,10 Q 50,5 85,45" stroke="white" stroke-width="2.5" stroke-dasharray="4 2" fill="none"/>
                    <path d="M 75,42 L 87,47 L 85,33" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <!-- 2. Bottom Left Annotation: Video Editor -->
            <div class="absolute top-[62%] left-[12%] sm:left-[18%] md:left-[22%] flex flex-col items-center rotate-[6deg]">
                <span class="font-cursive text-2xl sm:text-3xl md:text-4xl text-white font-bold tracking-wide">video editor</span>
                <svg class="w-16 h-12 sm:w-20 sm:h-16 text-white stroke-current fill-none mt-1 transform -rotate-12" viewBox="0 0 100 60">
                    <path d="M 15,50 Q 50,45 85,15" stroke="white" stroke-width="2.5" stroke-dasharray="4 2" fill="none"/>
                    <path d="M 72,13 L 87,13 L 82,27" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <!-- 3. Top Right Annotation: Influencer -->
            <div class="absolute top-[39%] right-[16%] sm:right-[22%] md:right-[26%] flex flex-col items-center rotate-[8deg]">
                <span class="font-cursive text-2xl sm:text-3xl md:text-4xl text-white font-bold tracking-wide">influencer</span>
                <svg class="w-16 h-12 sm:w-20 sm:h-16 text-white stroke-current fill-none mt-1 transform -rotate-12" viewBox="0 0 100 60">
                    <path d="M 85,10 Q 45,5 15,45" stroke="white" stroke-width="2.5" stroke-dasharray="4 2" fill="none"/>
                    <path d="M 25,42 L 13,47 L 15,33" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <!-- 4. Bottom Right Annotation: Graphic Designer -->
            <div class="absolute top-[60%] right-[12%] sm:right-[18%] md:right-[22%] flex flex-col items-center rotate-[-6deg]">
                <span class="font-cursive text-2xl sm:text-3xl md:text-4xl text-white font-bold tracking-wide">graphic designer</span>
                <svg class="w-16 h-12 sm:w-20 sm:h-16 text-white stroke-current fill-none mt-1 transform rotate-12" viewBox="0 0 100 60">
                    <path d="M 85,50 Q 50,45 15,15" stroke="white" stroke-width="2.5" stroke-dasharray="4 2" fill="none"/>
                    <path d="M 28,13 L 13,13 L 18,27" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

        </div>

        <!-- Floating Stickers & Graphic Elements -->
        
        <!-- Top-Left: Cassette Tape ("THE 1975" theme) -->
        <div class="absolute top-[8%] left-[2%] sm:left-[5%] md:left-[8%] z-30 animate-float sticker-shadow" style="--rot: -22deg; --rot-hover: -15deg;">
            <div class="w-36 sm:w-48 md:w-56 bg-zinc-900 border-2 border-white/80 rounded-xl p-3 shadow-2xl transform -rotate-[22deg]">
                <!-- Cassette Label -->
                <div class="bg-white rounded p-2 text-black text-center shadow-inner">
                    <div class="text-[9px] font-black tracking-widest border-b border-black pb-0.5">THE 1975</div>
                    <div class="flex justify-between items-center my-2 px-2">
                        <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-zinc-900 border-2 border-gray-400 flex items-center justify-center">
                            <div class="w-2 h-2 rounded-full bg-white"></div>
                        </div>
                        <div class="h-3 w-12 bg-zinc-200 rounded border border-zinc-400 flex items-center justify-center text-[7px] text-zinc-600 font-mono">SIDE A</div>
                        <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-zinc-900 border-2 border-gray-400 flex items-center justify-center">
                            <div class="w-2 h-2 rounded-full bg-white"></div>
                        </div>
                    </div>
                    <div class="text-[7px] font-bold uppercase tracking-wider text-gray-700">High Fidelity Stereo Tape</div>
                </div>
            </div>
        </div>

        <!-- Middle-Left Top: Musical Notes -->
        <div class="absolute top-[12%] left-[28%] sm:left-[30%] z-20 animate-float-alt text-white opacity-90 sticker-shadow" style="--rot: -12deg; --rot-hover: 0deg;">
            <svg class="w-10 h-10 sm:w-14 sm:h-14 transform -rotate-12 filter drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </div>

        <!-- Bottom-Left: Vinyl Record / Turntable Disc -->
        <div class="absolute bottom-[6%] left-[3%] sm:left-[6%] md:left-[9%] z-30 animate-float-alt sticker-shadow" style="--rot: 10deg; --rot-hover: 18deg;">
            <div class="w-28 h-28 sm:w-36 sm:h-36 md:w-44 md:h-44 rounded-full bg-zinc-950 p-1 border-2 border-white/40 shadow-2xl flex items-center justify-center relative transform rotate-12">
                <!-- Vinyl Grooves -->
                <div class="w-full h-full rounded-full border-4 border-zinc-900 flex items-center justify-center">
                    <div class="w-3/4 h-3/4 rounded-full border-2 border-zinc-800 flex items-center justify-center">
                        <!-- Vinyl Center Label -->
                        <div class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 rounded-full bg-white border-4 border-black flex flex-col items-center justify-center text-black">
                            <span class="text-[7px] sm:text-[9px] font-black uppercase tracking-tighter">STEREO</span>
                            <div class="w-2 h-2 rounded-full bg-black my-0.5"></div>
                            <span class="text-[6px] font-bold">33 RPM</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top-Right: Over-ear Modern Headphones -->
        <div class="absolute top-[10%] right-[3%] sm:right-[6%] md:right-[8%] z-30 animate-float sticker-shadow" style="--rot: 25deg; --rot-hover: 15deg;">
            <div class="w-28 sm:w-36 md:w-44 transform rotate-[25deg]">
                <svg viewBox="0 0 200 200" class="w-full h-full filter drop-shadow-2xl">
                    <!-- Headband -->
                    <path d="M 40 110 A 70 70 0 0 1 160 110" fill="none" stroke="#f8fafc" stroke-width="16" stroke-linecap="round"/>
                    <!-- Left Ear Cup -->
                    <rect x="25" y="100" width="30" height="50" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
                    <rect x="20" y="108" width="10" height="34" rx="5" fill="#e2e8f0"/>
                    <!-- Right Ear Cup -->
                    <rect x="145" y="100" width="30" height="50" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
                    <rect x="170" y="108" width="10" height="34" rx="5" fill="#e2e8f0"/>
                </svg>
            </div>
        </div>

        <!-- Bottom-Right: Movie Clapperboard -->
        <div class="absolute bottom-[8%] right-[3%] sm:right-[6%] md:right-[9%] z-30 animate-float sticker-shadow" style="--rot: -18deg; --rot-hover: -10deg;">
            <div class="w-32 sm:w-40 md:w-48 bg-zinc-900 border-2 border-white rounded-lg p-2.5 shadow-2xl transform -rotate-[18deg]">
                <!-- Clapper Top Stick -->
                <div class="bg-white rounded-t p-1 flex justify-between gap-1 mb-1 border-b-2 border-zinc-900">
                    <div class="h-4 w-5 bg-zinc-900 transform -skew-x-12"></div>
                    <div class="h-4 w-5 bg-zinc-900 transform -skew-x-12"></div>
                    <div class="h-4 w-5 bg-zinc-900 transform -skew-x-12"></div>
                    <div class="h-4 w-5 bg-zinc-900 transform -skew-x-12"></div>
                </div>
                <!-- Clapper Text Body -->
                <div class="border border-white/40 p-1.5 rounded text-[8px] sm:text-[10px] font-mono grid grid-cols-2 gap-1 text-white">
                    <div class="border-b border-r border-white/30 p-0.5">SCENE<br><span class="font-bold text-white text-xs">04</span></div>
                    <div class="border-b border-white/30 p-0.5">TAKE<br><span class="font-bold text-white text-xs">01</span></div>
                    <div class="col-span-2 pt-0.5 text-center font-sans font-bold text-[9px] tracking-wider">CREATIVE DIR.</div>
                </div>
            </div>
        </div>

        <!-- Scattered White Stars and Butterflies -->
        
        <!-- Star 1 (Top Left) -->
        <div class="absolute top-[28%] left-[8%] sm:left-[12%] text-white animate-star">
            <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
            </svg>
        </div>

        <!-- Star 2 (Top Right) -->
        <div class="absolute top-[7%] right-[22%] text-white animate-star" style="animation-delay: 1s;">
            <svg class="w-5 h-5 sm:w-7 sm:h-7" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
            </svg>
        </div>

        <!-- Star 3 (Bottom Right) -->
        <div class="absolute bottom-[22%] right-[5%] sm:right-[8%] text-white animate-star" style="animation-delay: 2s;">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
            </svg>
        </div>

        <!-- Butterfly Left -->
        <div class="absolute top-[55%] left-[6%] sm:left-[10%] text-white/90 animate-float-alt">
            <svg class="w-7 h-7 sm:w-9 sm:h-9 transform -rotate-45" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12,2C12,2 10.5,6.5 8,8C5.5,9.5 2,8.5 2,12C2,15.5 5,16 7,16.5C9,17 11,20 12,22C13,20 15,17 17,16.5C19,16 22,15.5 22,12C22,8.5 18.5,9.5 16,8C13.5,6.5 12,2 12,2Z"/>
            </svg>
        </div>

        <!-- Butterfly Right -->
        <div class="absolute bottom-[18%] right-[24%] sm:right-[28%] text-white/90 animate-float">
            <svg class="w-6 h-6 sm:w-8 sm:h-8 transform rotate-12" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12,2C12,2 10.5,6.5 8,8C5.5,9.5 2,8.5 2,12C2,15.5 5,16 7,16.5C9,17 11,20 12,22C13,20 15,17 17,16.5C19,16 22,15.5 22,12C22,8.5 18.5,9.5 16,8C13.5,6.5 12,2 12,2Z"/>
            </svg>
        </div>

    </main>

    <!-- Footer CTA Bar -->
    <footer class="w-full max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row justify-between items-center text-xs text-white/70 border-t border-white/10 gap-4 z-50">
        <div>© 2026 Creative Portfolio. All rights reserved.</div>
        <div class="flex space-x-6 text-base">
            <a href="#" class="hover:text-white transition"><i class="fa-brands font-semibold fa-instagram"></i></a>
            <a href="#" class="hover:text-white transition"><i class="fa-brands font-semibold fa-tiktok"></i></a>
            <a href="#" class="hover:text-white transition"><i class="fa-brands font-semibold fa-youtube"></i></a>
            <a href="#" class="hover:text-white transition"><i class="fa-brands font-semibold fa-linkedin"></i></a>
        </div>
    </footer>

</body>
</html>
